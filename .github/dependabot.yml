# Weekly dependency updates. Minor and patch updates are grouped into one PR per ecosystem;
# major updates get their own PR, since they are the ones that need reading.
version: 2

updates:
  # The uv workspace: one uv.lock at the root covers every package under packages/ and workflows/.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # Images in compose.yaml (local testing) and deploy/compose.yaml (the release's compose file).
  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: weekly
    groups:
      images:
        update-types: [minor, patch]
    commit-message:
      prefix: compose

  # The Dockerfile's base image (python) and the uv image it copies uv from.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
    commit-message:
      prefix: docker
