[project]
name = "alexandria-workflows"
version = "0.1.0"
description = "Prefect flows that run the Alexandria ingest pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alexandria-core",
    "alexandria-embed",
    "alexandria-ingest",
    "prefect>=3.4",
    "typer>=0.27.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexandria_workflows"]

[project.scripts]
alexandria-workflows = "alexandria_workflows.flows:app"

[tool.uv.sources]
alexandria-core = { workspace = true }
alexandria-embed = { workspace = true }
alexandria-ingest = { workspace = true }
