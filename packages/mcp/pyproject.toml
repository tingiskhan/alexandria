[project]
name = "alexandria-mcp"
version = "0.1.0"
description = "Read-only MCP server that lets an LLM agent search an Alexandria library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alexandria-core",
    "alexandria-embed",
    "mcp>=2.3",
    "typer>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexandria_mcp"]

[project.scripts]
alexandria-mcp = "alexandria_mcp.main:run"

[tool.uv.sources]
alexandria-core = { workspace = true }
alexandria-embed = { workspace = true }
