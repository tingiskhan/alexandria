[project]
name = "alexandria-core"
version = "0.1.0"
description = "Domain types, protocols, Postgres schema, PgStore and hybrid search for Alexandria"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["sqlalchemy>=2.1.6", "psycopg[binary]>=3.3.6", "pgvector>=0.4", "pydantic-settings>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexandria_core"]
