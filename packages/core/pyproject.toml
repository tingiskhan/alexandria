[project]
name = "alexandria-core"
version = "0.1.0"
description = "Domain types, protocols, Postgres schema and migrations, PgStore and hybrid search for Alexandria"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18",
    "pgvector>=0.4",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
]

[project.scripts]
alexandria-db = "alexandria_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexandria_core"]
