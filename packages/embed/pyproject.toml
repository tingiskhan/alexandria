[project]
name = "alexandria-embed"
version = "0.1.0"
description = "Sentence-transformers embedder for Alexandria"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["alexandria-core", "sentence-transformers>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexandria_embed"]

[tool.uv.sources]
alexandria-core = { workspace = true }
